[package]
name = "ardntai"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

# TUI (NEXT.md): ratatui + crossterm. `font8x8` tylko do zrzutu PNG.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
font8x8 = "0.3"
